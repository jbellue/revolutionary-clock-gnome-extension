name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install ESLint
        run: npm install --global eslint@10

      - name: Run lint
        run: eslint --max-warnings=0 "src/**/*.js"

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Package and Upload Extension
        id: package
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: src
          output-dir: dist
          gettext-domain: revolutionary-clock
          extra-source: |
            cacheManager.js
            clockIndicator.js
            datePopup.js
            republicanCalendar.js
            republicanClock.js
            translations.js
            wikiImageManager.js
            locale-ca.js
            locale-en.js
            locale-es.js
            locale-fr.js
            locale
            ui
          username: ${{ secrets.GNOME_USERNAME }}
          password: ${{ secrets.GNOME_PASSWORD }}
          accept-tos: true
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip-file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
