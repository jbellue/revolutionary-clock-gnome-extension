name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install ESLint
        run: npm install --global eslint@10

      - name: Run lint
        run: eslint --max-warnings=0 "src/**/*.js"

  release:
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Calculate semantic version
        id: semver
        run: |
          # Get last tag or start from v0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          # Count commit types since last tag
          BREAKING=$(git log "${LAST_TAG}..HEAD" --oneline | grep -c "^.*BREAKING" || true)
          FEATURES=$(git log "${LAST_TAG}..HEAD" --oneline | grep -c "^.*feat:" || true)
          FIXES=$(git log "${LAST_TAG}..HEAD" --oneline | grep -c "^.*fix:" || true)
          
          # Parse current version
          CURRENT_VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          
          # Default to 0 if not a number
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Bump version
          if [ "$BREAKING" -gt 0 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$FEATURES" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$FIXES" -gt 0 ]; then
            PATCH=$((PATCH + 1))
          else
            # No commits, just bump patch
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update metadata.json
        run: |
          VERSION_NAME="${{ steps.semver.outputs.version }}"
          jq --arg v "$VERSION_NAME" '.["version-name"] = $v' src/metadata.json > src/metadata.json.tmp
          mv src/metadata.json.tmp src/metadata.json

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/metadata.json
          git commit -m "chore: release ${{ steps.semver.outputs.tag }}"
          git tag "${{ steps.semver.outputs.tag }}"

      - name: Push tag
        run: |
          git push origin "${{ steps.semver.outputs.tag }}"

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Package and Upload Extension
        id: package
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          source-dir: src
          output-dir: dist
          gettext-domain: revolutionary-clock
          extra-source: |
            cacheManager.js
            clockIndicator.js
            datePopup.js
            republicanCalendar.js
            republicanClock.js
            translations.js
            wikiImageManager.js
            locale-ca.js
            locale-en.js
            locale-es.js
            locale-fr.js
            locale
            ui
          username: jbellue
          password: ${{ secrets.GNOME_PASSWORD }}
          accept-tos: true
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip-file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
